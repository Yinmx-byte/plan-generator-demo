<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检修方案生成助手</title>
<style>
  :root {
    --ink: #17212f;
    --ink-soft: #3e4a5b;
    --muted: #6f7b8c;
    --line: #d9e0e8;
    --line-strong: #c5ced9;
    --paper: #fbfcf7;
    --panel: #ffffff;
    --panel-warm: #f7f6ef;
    --rail: #eef2f3;
    --blue: #1f5f99;
    --blue-dark: #17456f;
    --green: #1f7a5c;
    --green-soft: #e8f3ed;
    --amber: #a76512;
    --amber-soft: #fff4dd;
    --red: #b42318;
    --red-soft: #fff0ee;
    --shadow: 0 18px 45px rgba(20, 31, 45, 0.12);
    --shadow-soft: 0 8px 24px rgba(20, 31, 45, 0.08);
  }
  * { box-sizing: border-box; }
  *::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  *::-webkit-scrollbar-track {
    background: transparent;
  }
  *::-webkit-scrollbar-thumb {
    background: #c5ced9;
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: content-box;
  }
  body {
    margin: 0;
    height: 100vh;
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:
      linear-gradient(90deg, rgba(23, 33, 47, 0.035) 1px, transparent 1px),
      linear-gradient(rgba(23, 33, 47, 0.035) 1px, transparent 1px),
      linear-gradient(135deg, #eef2f3 0%, #faf9f0 48%, #e9f0ee 100%);
    background-size: 28px 28px, 28px 28px, auto;
  }
  .app {
    width: min(1440px, 100%);
    height: 100vh;
    margin: 0 auto;
    padding: 18px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    gap: 14px;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    min-height: 70px;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(197, 206, 217, 0.82);
    border-radius: 8px;
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(10px);
  }
  header > div:first-child {
    display: grid;
    gap: 4px;
  }
  h1 {
    margin: 0;
    color: var(--ink);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0;
  }
  h2 {
    margin: 0;
    font-size: 14px;
    color: var(--ink);
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .status-strip {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  .metric {
    min-height: 54px;
    padding: 10px 12px;
    border: 1px solid rgba(197, 206, 217, 0.86);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.72);
    box-shadow: var(--shadow-soft);
  }
  .metric strong {
    display: block;
    margin-bottom: 3px;
    font-size: 13px;
    color: var(--ink);
  }
  .metric span {
    display: block;
    font-size: 12px;
    color: var(--muted);
  }
  button {
    min-height: 36px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    transition: background 160ms ease, border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
  }
  button:hover {
    border-color: var(--line-strong);
    box-shadow: 0 5px 16px rgba(20, 31, 45, 0.08);
    transform: translateY(-1px);
  }
  button.primary {
    min-width: 108px;
    border-color: var(--blue-dark);
    background: var(--blue);
    color: #fff;
    font-weight: 700;
  }
  button.primary:hover {
    background: var(--blue-dark);
  }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .chat {
    grid-column: 1;
    grid-row: 3;
    min-height: 0;
    background: rgba(255, 255, 255, 0.84);
    border: 1px solid rgba(197, 206, 217, 0.92);
    border-radius: 8px;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  .messages {
    padding: 22px;
    overflow-y: auto;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.7), rgba(251,252,247,0.86)),
      radial-gradient(circle at 18px 18px, rgba(31,95,153,0.08) 1px, transparent 1px);
    background-size: auto, 26px 26px;
  }
  .msg {
    max-width: min(760px, 82%);
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 14px;
    box-shadow: 0 5px 18px rgba(20, 31, 45, 0.06);
  }
  .msg.assistant {
    background: #ffffff;
    border: 1px solid var(--line);
  }
  .msg.user {
    background: #eaf2f8;
    border: 1px solid #c9dcea;
    margin-left: auto;
  }
  .msg.status {
    max-width: 560px;
    background: var(--amber-soft);
    border: 1px solid #e6c57f;
    color: #70460a;
  }
  .msg.error {
    background: var(--red-soft);
    color: var(--red);
    border: 1px solid #efb9b3;
  }
  .download {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
  }
  .composer {
    grid-column: 1;
    grid-row: 4;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(197, 206, 217, 0.92);
    border-radius: 8px;
    padding: 14px;
    display: grid;
    gap: 12px;
    box-shadow: var(--shadow-soft);
  }
  textarea {
    width: 100%;
    min-height: 112px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 13px;
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: #fff;
  }
  textarea:focus,
  input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(31, 95, 153, 0.12);
  }
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .send-options {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .check-option {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--ink-soft);
    font-size: 13px;
    user-select: none;
  }
  .check-option input {
    width: 16px;
    height: 16px;
    margin: 0;
  }
  .hint { color: var(--muted); font-size: 12px; }
  aside {
    grid-column: 2;
    grid-row: 3 / 5;
    min-height: 0;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(197, 206, 217, 0.92);
    border-radius: 8px;
    display: grid;
    grid-template-rows: auto 1fr auto auto auto auto;
    overflow: hidden;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  .skills-head {
    padding: 14px 14px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-warm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .section-kicker {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
  }
  .skill-list {
    padding: 10px;
    overflow-y: auto;
    background: #fff;
  }
  .skill-item {
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #ffffff 0%, #f8faf8 100%);
  }
  .skill-name {
    font-size: 13px;
    font-weight: 700;
    word-break: break-word;
  }
  .skill-desc {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .upload {
    border-top: 1px solid var(--line);
    padding: 12px;
    display: grid;
    gap: 9px;
    background: #fbfcfa;
  }
  .upload input[type="text"],
  .upload input[type="file"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px;
    font: inherit;
    font-size: 13px;
    background: #fff;
    color: var(--ink);
  }
  .upload-status {
    min-height: 18px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
  }
  .side-actions {
    border-top: 1px solid var(--line);
    padding: 12px;
    display: grid;
    gap: 8px;
    background: #f4f7f6;
  }
  .side-actions .side-section-title {
    padding: 0;
    background: transparent;
  }
  .side-actions textarea {
    min-height: 76px;
    font-size: 13px;
  }
  .side-actions .button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .side-section-title {
    padding: 12px 14px 0;
    font-weight: 700;
    font-size: 14px;
    background: #fbfcfa;
  }
  .side-section-title .section-kicker {
    margin-bottom: 2px;
  }
  .knowledge-list {
    max-height: 150px;
    overflow-y: auto;
    padding: 8px 10px 0;
    background: #fbfcfa;
  }
  .knowledge-item {
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
    background: #fff;
    font-size: 12px;
    word-break: break-word;
    color: var(--ink-soft);
  }
  @media (max-width: 900px) {
    .app {
      height: auto;
      min-height: 100vh;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto minmax(420px, 1fr) auto auto;
    }
    .status-strip { grid-template-columns: 1fr; }
    aside { grid-row: auto; }
    .chat,
    .composer,
    aside { grid-column: 1; }
    .msg { max-width: 94%; }
  }
  @media (max-width: 640px) {
    .app { padding: 10px; }
    header { align-items: flex-start; flex-direction: column; }
    .header-actions { width: 100%; }
    .header-actions button { flex: 1; }
    .actions { align-items: stretch; flex-direction: column; }
    .send-options { align-items: flex-start; flex-direction: column; }
    button.primary { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>国网云平台检修方案生成助手</h1>
      <p class="subtitle">需求抽取、Skill 编排、RAG 参考与 Page Agent 验证集中在同一个工作流</p>
    </div>
    <div class="header-actions">
      <button id="refreshSkillsBtn">刷新 Skill</button>
      <button id="resetBtn">新建对话</button>
    </div>
  </header>

  <section class="status-strip" aria-label="流程状态">
    <div class="metric">
      <strong>输入方式</strong>
      <span>粘贴需求描述或需求文档</span>
    </div>
    <div class="metric">
      <strong>生成依据</strong>
      <span>Skill 规则优先，RAG 资料补充</span>
    </div>
    <div class="metric">
      <strong>验证方式</strong>
      <span>Page Agent 只读浏览器验证</span>
    </div>
  </section>

  <main class="chat">
    <div class="messages" id="messages"></div>
  </main>

  <aside>
    <div class="skills-head">
      <h2>当前 Skill<span class="section-kicker">决定方案类型、章节结构与操作规则</span></h2>
      <span class="hint" id="skillCount">0 个</span>
    </div>
    <div class="skill-list" id="skillList"></div>
    <form class="upload" id="uploadForm">
      <input id="skillNameInput" name="skill_name" type="text" placeholder="Skill 目录名，可选">
      <input id="skillFileInput" name="file" type="file" accept=".md,.zip">
      <button class="primary" type="submit">上传 Skill</button>
      <div class="upload-status" id="uploadStatus"></div>
    </form>
    <div class="side-section-title">知识文档<span class="section-kicker">内部模板、历史方案、云产品说明</span></div>
    <div class="knowledge-list" id="knowledgeList"></div>
    <form class="upload" id="knowledgeUploadForm">
      <input id="knowledgeCategoryInput" name="category" type="text" placeholder="分类目录，例如 internal-templates">
      <input id="knowledgeFileInput" name="file" type="file" accept=".md,.txt,.docx">
      <button class="primary" type="submit">上传知识文档</button>
      <div class="upload-status" id="knowledgeUploadStatus"></div>
    </form>
    <div class="side-actions">
      <div class="side-section-title">Page Agent<span class="section-kicker">浏览器自动化与下载链路验证</span></div>
      <textarea id="pageAgentTaskInput" placeholder="例如：打开 https://www.baidu.com 并告诉我页面标题"></textarea>
      <div class="button-row">
        <button id="startMcpBtn" type="button">启动 Page Agent</button>
        <button id="runPageAgentBtn" type="button">执行测试</button>
      </div>
      <div class="upload-status" id="mcpStatus">可先启动 Page Agent，再输入一条浏览器自动化指令测试效果。</div>
    </div>
  </aside>

  <section class="composer">
    <textarea id="messageInput" placeholder="例如：请生成一份内网总部 ESB 组件创建 ECS 实例的检修方案。检修窗口、人员、账号、技术参数可以一起粘贴进来。"></textarea>
    <div class="actions">
      <div class="send-options">
        <label class="check-option">
          <input id="executeValidationInput" type="checkbox">
          <span>生成后执行浏览器验证</span>
        </label>
        <span class="hint">验证只做页面/下载链路检查，不执行真实生产变更；Ctrl + Enter 可快速发送。</span>
      </div>
      <button class="primary" id="sendBtn">发送</button>
    </div>
  </section>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');
const refreshSkillsBtn = document.getElementById('refreshSkillsBtn');
const skillListEl = document.getElementById('skillList');
const skillCountEl = document.getElementById('skillCount');
const uploadForm = document.getElementById('uploadForm');
const uploadStatus = document.getElementById('uploadStatus');
const skillNameInput = document.getElementById('skillNameInput');
const skillFileInput = document.getElementById('skillFileInput');
const knowledgeListEl = document.getElementById('knowledgeList');
const knowledgeUploadForm = document.getElementById('knowledgeUploadForm');
const knowledgeCategoryInput = document.getElementById('knowledgeCategoryInput');
const knowledgeFileInput = document.getElementById('knowledgeFileInput');
const knowledgeUploadStatus = document.getElementById('knowledgeUploadStatus');
const executeValidationInput = document.getElementById('executeValidationInput');
const startMcpBtn = document.getElementById('startMcpBtn');
const runPageAgentBtn = document.getElementById('runPageAgentBtn');
const pageAgentTaskInput = document.getElementById('pageAgentTaskInput');
const mcpStatus = document.getElementById('mcpStatus');
let sessionId = localStorage.getItem('planGeneratorSessionId') || null;

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, text, extraHtml = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (extraHtml) {
    const wrap = document.createElement('div');
    wrap.innerHTML = extraHtml;
    div.appendChild(wrap);
  }
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  inputEl.disabled = busy;
  sendBtn.textContent = busy ? '生成中...' : '发送';
}

function renderSkills(skills) {
  skillCountEl.textContent = `${skills.length} 个`;
  skillListEl.innerHTML = '';
  if (!skills.length) {
    skillListEl.innerHTML = '<div class="hint">暂无 Skill</div>';
    return;
  }
  skills.forEach((skill) => {
    const item = document.createElement('div');
    item.className = 'skill-item';
    const name = document.createElement('div');
    name.className = 'skill-name';
    name.textContent = skill.name;
    const desc = document.createElement('div');
    desc.className = 'skill-desc';
    desc.textContent = skill.description || '未填写描述';
    item.appendChild(name);
    item.appendChild(desc);
    skillListEl.appendChild(item);
  });
}

async function loadSkills() {
  try {
    const resp = await fetch('/api/skills');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '加载失败');
    renderSkills(data.skills || []);
  } catch (err) {
    skillListEl.innerHTML = `<div class="msg error">Skill 加载失败：${err.message}</div>`;
  }
}

function renderKnowledge(documents) {
  knowledgeListEl.innerHTML = '';
  if (!documents.length) {
    knowledgeListEl.innerHTML = '<div class="hint">暂无知识文档</div>';
    return;
  }
  documents.forEach((doc) => {
    const item = document.createElement('div');
    item.className = 'knowledge-item';
    item.textContent = `${doc.path} (${Math.ceil(doc.size / 1024)} KB)`;
    knowledgeListEl.appendChild(item);
  });
}

async function loadKnowledge() {
  try {
    const resp = await fetch('/api/knowledge');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '加载失败');
    renderKnowledge(data.documents || []);
  } catch (err) {
    knowledgeListEl.innerHTML = `<div class="msg error">知识文档加载失败：${err.message}</div>`;
  }
}

function parseSseChunk(buffer, onEvent) {
  const parts = buffer.split('\n\n');
  const rest = parts.pop();
  parts.forEach((part) => {
    let event = 'message';
    let data = '';
    part.split('\n').forEach((line) => {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      if (line.startsWith('data:')) data += line.slice(5).trim();
    });
    if (!data) return;
    onEvent(event, JSON.parse(data));
  });
  return rest;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage('user', text);
  inputEl.value = '';
  setBusy(true);
  let statusMsg = null;
  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sessionId,
        message: text,
        execute_validation: executeValidationInput.checked
      })
    });
    if (!resp.ok || !resp.body) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.detail || '请求失败');
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    const handleEvent = (event, data) => {
      if (data.session_id) {
        sessionId = data.session_id;
        localStorage.setItem('planGeneratorSessionId', sessionId);
      }
      if (event === 'status' || event === 'collected') {
        if (!statusMsg) statusMsg = addMessage('status', data.message || '处理中...');
        statusMsg.textContent = data.message || '处理中...';
      } else if (event === 'evidence') {
        const skills = (data.selected_skills || []).join('、') || '未命中明确 Skill';
        const ragText = data.rag_enabled
          ? `RAG 已启用，命中 ${data.rag_chunks_count || 0} 个参考片段`
          : 'RAG 未启用，当前仅使用 Skill 规则与用户输入';
        if (!statusMsg) statusMsg = addMessage('status', data.message || '生成依据已准备完成');
        statusMsg.textContent = `${data.message || '生成依据已准备完成'}\n候选 Skill：${skills}\n${ragText}`;
      } else if (event === 'done') {
        statusMsg = null;
        if (data.status === 'generated') {
          const validationText = data.validation_result
            ? `\n\nPage Agent 验证结果：\n${data.validation_result}`
            : '';
          addMessage('assistant', data.message + validationText, `<a class="download" href="${data.download_url}">下载检修方案</a>`);
        } else {
          addMessage('assistant', data.message);
        }
      } else if (event === 'error') {
        statusMsg = null;
        addMessage('error', data.message || '处理失败');
      }
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      buffer = parseSseChunk(buffer, handleEvent);
    }
    if (buffer.trim()) parseSseChunk(buffer + '\n\n', handleEvent);
  } catch (err) {
    addMessage('error', '处理失败：' + err.message);
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

async function resetChat() {
  if (sessionId) {
    await fetch('/api/chat/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    }).catch(() => {});
  }
  sessionId = null;
  localStorage.removeItem('planGeneratorSessionId');
  messagesEl.innerHTML = '';
  addMessage('assistant', '请粘贴检修需求描述或需求文档。我会流式抽取关键信息，缺什么继续问；信息齐全后自动生成 Word 检修方案。');
  inputEl.focus();
}

uploadForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const file = skillFileInput.files[0];
  if (!file) {
    uploadStatus.textContent = '请选择 SKILL.md 或 zip 文件';
    return;
  }
  const formData = new FormData();
  formData.append('file', file);
  formData.append('skill_name', skillNameInput.value.trim());
  uploadStatus.textContent = '正在上传...';
  try {
    const resp = await fetch('/api/skills/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '上传失败');
    renderSkills(data.skills || []);
    uploadStatus.textContent = '上传完成，Skill 已刷新';
    skillFileInput.value = '';
    skillNameInput.value = '';
  } catch (err) {
    uploadStatus.textContent = '上传失败：' + err.message;
  }
});

knowledgeUploadForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const file = knowledgeFileInput.files[0];
  if (!file) {
    knowledgeUploadStatus.textContent = '请选择 md、txt 或 docx 文件';
    return;
  }
  const formData = new FormData();
  formData.append('file', file);
  formData.append('category', knowledgeCategoryInput.value.trim() || 'uploaded');
  knowledgeUploadStatus.textContent = '正在导入...';
  try {
    const resp = await fetch('/api/knowledge/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '导入失败');
    renderKnowledge(data.documents || []);
    knowledgeUploadStatus.textContent = '导入完成，下一次检索会重建索引';
    knowledgeFileInput.value = '';
  } catch (err) {
    knowledgeUploadStatus.textContent = '导入失败：' + err.message;
  }
});

startMcpBtn.addEventListener('click', async () => {
  startMcpBtn.disabled = true;
  mcpStatus.textContent = '正在启动 Page Agent MCP...';
  try {
    const resp = await fetch('/api/mcp/start', { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.message || '启动失败');
    mcpStatus.textContent = 'Page Agent 已启动。请在 Chrome 中确认扩展 Hub 已连接。';
  } catch (err) {
    mcpStatus.textContent = 'Page Agent 启动失败：' + err.message;
  } finally {
    startMcpBtn.disabled = false;
  }
});

runPageAgentBtn.addEventListener('click', async () => {
  const task = pageAgentTaskInput.value.trim();
  if (!task) {
    mcpStatus.textContent = '请输入一条 Page Agent 测试指令';
    return;
  }
  runPageAgentBtn.disabled = true;
  mcpStatus.textContent = 'Page Agent 正在执行测试指令...';
  try {
    const resp = await fetch('/api/page-agent/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.message || '执行失败');
    mcpStatus.textContent = 'Page Agent 执行完成';
    addMessage('assistant', `Page Agent 测试结果：\n${data.result || '无返回内容'}`);
  } catch (err) {
    mcpStatus.textContent = 'Page Agent 执行失败：' + err.message;
    addMessage('error', 'Page Agent 执行失败：' + err.message);
  } finally {
    runPageAgentBtn.disabled = false;
  }
});

sendBtn.addEventListener('click', sendMessage);
resetBtn.addEventListener('click', resetChat);
refreshSkillsBtn.addEventListener('click', loadSkills);
inputEl.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    sendMessage();
  }
});

addMessage('assistant', '请粘贴检修需求描述或需求文档。我会流式抽取关键信息，缺什么继续问；信息齐全后自动生成 Word 检修方案。');
loadSkills();
loadKnowledge();
</script>
</body>
</html>
