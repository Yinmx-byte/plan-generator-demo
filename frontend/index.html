<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检修方案生成助手</title>
<style>
  :root {
    --primary: #1a73e8;
    --border: #dfe3ea;
    --bg: #eef1f5;
    --panel: #fff;
    --text: #273142;
    --muted: #6b7280;
    --assistant: #f6f8fb;
    --user: #e8f0fe;
    --danger: #c5221f;
    --success: #137333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
  }
  .app {
    max-width: 1040px;
    height: 100vh;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 18px;
    gap: 12px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  h1 { font-size: 20px; margin: 0; color: var(--primary); }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .reset {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .chat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr;
    min-height: 0;
  }
  .messages {
    padding: 18px;
    overflow-y: auto;
  }
  .msg {
    max-width: 78%;
    margin-bottom: 12px;
    padding: 11px 13px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 14px;
  }
  .msg.assistant {
    background: var(--assistant);
    border: 1px solid var(--border);
  }
  .msg.user {
    background: var(--user);
    margin-left: auto;
  }
  .msg.error {
    background: #fce8e6;
    color: var(--danger);
    border: 1px solid #f4b6b1;
  }
  .download {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--success);
    color: #fff;
    text-decoration: none;
  }
  .composer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: grid;
    gap: 10px;
  }
  textarea {
    width: 100%;
    min-height: 112px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 11px 12px;
    font: inherit;
    line-height: 1.5;
  }
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(26,115,232,0.12);
  }
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .hint { color: var(--muted); font-size: 12px; }
  button.primary {
    min-width: 108px;
    border: none;
    background: var(--primary);
    color: #fff;
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  @media (max-width: 720px) {
    .app { padding: 10px; }
    header { align-items: flex-start; flex-direction: column; }
    .msg { max-width: 94%; }
    .actions { align-items: stretch; flex-direction: column; }
    button.primary { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>国网云平台检修方案生成助手</h1>
      <p class="subtitle">直接粘贴需求描述或需求文档，助手会追问缺失信息并生成 Word 方案</p>
    </div>
    <button class="reset" id="resetBtn">新建对话</button>
  </header>

  <main class="chat">
    <div class="messages" id="messages"></div>
  </main>

  <section class="composer">
    <textarea id="messageInput" placeholder="例如：需要为内网总部 ESB 组件创建 ECS 实例，组织为数字化工作部，资源集为总部ESB组件系统，窗口为 2026年5月25日 18:00 至 20:00，执行人..."></textarea>
    <div class="actions">
      <span class="hint">缺少人员、窗口、账号等关键信息时，助手会继续追问。</span>
      <button class="primary" id="sendBtn">发送</button>
    </div>
  </section>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');
let sessionId = localStorage.getItem('planGeneratorSessionId') || null;

function addMessage(role, text, extraHtml = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (extraHtml) {
    const wrap = document.createElement('div');
    wrap.innerHTML = extraHtml;
    div.appendChild(wrap);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  inputEl.disabled = busy;
  sendBtn.textContent = busy ? '处理中...' : '发送';
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage('user', text);
  inputEl.value = '';
  setBusy(true);
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '请求失败');
    sessionId = data.session_id;
    localStorage.setItem('planGeneratorSessionId', sessionId);
    if (data.status === 'generated') {
      addMessage('assistant', data.message, `<a class="download" href="${data.download_url}">下载检修方案</a>`);
    } else {
      addMessage('assistant', data.message);
    }
  } catch (err) {
    addMessage('error', '处理失败：' + err.message);
  } finally {
    setBusy(false);
    inputEl.focus();
  }
}

async function resetChat() {
  if (sessionId) {
    await fetch('/api/chat/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    }).catch(() => {});
  }
  sessionId = null;
  localStorage.removeItem('planGeneratorSessionId');
  messagesEl.innerHTML = '';
  addMessage('assistant', '请粘贴检修需求描述或需求文档。我会先抽取关键信息，缺什么再继续问你；信息齐全后自动生成 Word 检修方案。');
  inputEl.focus();
}

sendBtn.addEventListener('click', sendMessage);
resetBtn.addEventListener('click', resetChat);
inputEl.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    sendMessage();
  }
});

addMessage('assistant', '请粘贴检修需求描述或需求文档。我会先抽取关键信息，缺什么再继续问你；信息齐全后自动生成 Word 检修方案。');
</script>
</body>
</html>
