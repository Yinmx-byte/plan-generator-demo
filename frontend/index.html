<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云平台智能运维助手</title>
<link rel="stylesheet" href="/styles/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="工作区导航">
    <div class="brand">
      <div class="brand-mark">检</div>
      <div>
        <h1>云平台智能运维助手</h1>
        <p>方案 · 问数 · 验证</p>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-page="plan">智能对话</button>
      <button class="nav-item" data-page="skills">Skill 管理</button>
      <button class="nav-item" data-page="knowledge">知识库</button>
      <button class="nav-item" data-page="page-agent">Page Agent</button>
      <button class="nav-item" data-page="iterator">质量迭代</button>
    </nav>
    <div class="sidebar-note">
      <strong>执行边界</strong>
      <span>可生成检修方案、查询云资源、管理 Skill/RAG，并通过 Page Agent 做浏览器侧验证。</span>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="pageEyebrow">Workspace</p>
        <h2 id="pageTitle">方案生成</h2>
      </div>
      <div class="topbar-actions">
        <button id="refreshAllBtn" type="button">刷新数据</button>
        <button id="resetBtn" type="button">新建对话</button>
      </div>
    </header>

    <section class="page-host" id="pageHost"></section>
  </main>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
