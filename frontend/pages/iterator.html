<section class="iterator-layout">
  <div class="tool-card iterator-control">
    <div class="iterator-intro">
      <div>
        <p class="eyebrow">Skill Quality Loop</p>
        <h3>检修 Skill 质量迭代</h3>
        <p>先生成候选文档，再从结构、风险、操作、回滚与格式维度评估，并给出可审阅的 Skill 优化建议。</p>
      </div>
      <span class="iterator-step-mark">01 配置评估</span>
    </div>

    <div class="iterator-setup-grid">
      <label>
        <span class="field-label">优质文档目录</span>
        <input id="iteratorReferenceDir" type="text" value="D:\个人工作\2026\微创项目\整理后文档\检修方案-整理">
      </label>
      <label>
        <span class="field-label">待评估 Skill</span>
        <select id="iteratorSkillSelect"></select>
      </label>
    </div>

    <label class="iterator-demand-field" for="iteratorMessage">
      <span class="field-label">测试需求文本</span>
      <textarea id="iteratorMessage" placeholder="粘贴一段完整检修需求；也可以只在结构化参数中填写测试条件。"></textarea>
    </label>

    <div class="iterator-parameter-bar">
      <div>
        <span class="field-label">结构化参数</span>
        <p id="iteratorStateSummary">尚未填写结构化参数</p>
      </div>
      <button id="openIteratorStateBtn" type="button">配置参数</button>
    </div>
    <textarea class="visually-hidden" id="iteratorStateJson" spellcheck="false" readonly tabindex="-1" aria-hidden="true"></textarea>

    <label class="check-option">
      <input id="iteratorAllowPartial" type="checkbox">
      <span>允许字段不完整时生成候选文档</span>
    </label>

    <div class="card-actions">
      <button id="runIteratorPreflightBtn" type="button">仅静态预检</button>
      <button class="primary" id="runIteratorBtn" type="button">生成并评估</button>
    </div>
    <div class="status-text" id="iteratorStatus">填写测试需求或结构化参数后，运行“生成并评估”。</div>
  </div>

  <div class="conversation-panel iterator-output">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Evaluation Report</p>
        <h3>迭代报告</h3>
      </div>
      <span class="pill" id="iteratorMode">未运行</span>
    </div>
    <div class="iterator-results" id="iteratorResults">
      <div class="empty-document">
        <strong>等待评估结果</strong>
        <span>报告会展示评分、主要问题、建议写回到 Skill 的规则。</span>
      </div>
    </div>
  </div>

  <dialog class="modal modal-wide iterator-state-dialog" id="iteratorStateDialog">
    <form method="dialog" class="modal-card iterator-state-card">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Structured Parameters</p>
          <h3>填写结构化测试参数</h3>
          <p>这些参数将与测试需求一起传给候选方案生成流程；带 * 的字段是完整生成所需条件。</p>
        </div>
        <button class="ghost" value="cancel" type="submit">关闭</button>
      </div>
      <div class="iterator-state-grid" id="iteratorStateFields"></div>
      <div class="modal-actions iterator-state-actions">
        <div>
          <button id="clearIteratorStateBtn" type="button">清空参数</button>
          <button id="fillIteratorSampleBtn" type="button">填入 ECS 示例</button>
        </div>
        <button class="primary" value="confirm" type="submit">保存参数</button>
      </div>
    </form>
  </dialog>
</section>
