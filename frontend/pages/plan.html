<section class="plan-layout">
  <div class="conversation-panel">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Master Agent</p>
        <h3>智能运维对话</h3>
      </div>
      <span class="pill">流式状态</span>
    </div>
    <div class="messages" id="messages"></div>
  </div>

  <section class="composer">
    <textarea id="messageInput" placeholder="可以直接聊天、查询云资源使用情况，也可以粘贴检修需求描述或需求文档。生成方案时可一次性包含检修窗口、人员、账号、实例、技术参数。"></textarea>
    <div class="composer-actions">
      <label class="check-option" hidden>
        <input id="executeValidationInput" type="checkbox">
        <span>生成后执行浏览器验证</span>
      </label>
      <label class="check-option archive-on-download-option" title="仅在下载时将主对话生成的方案保存为正式归档记录">
        <input id="archiveOnDownloadInput" type="checkbox">
        <span>下载后归档为正式方案</span>
      </label>
      <label class="check-option">
        <input id="showToolTraceInput" type="checkbox">
        <span>显示工具调用信息</span>
      </label>
      <button class="primary" id="sendBtn" type="button">发送</button>
    </div>
  </section>

  <dialog class="modal document-modal" id="documentDialog">
    <form method="dialog" class="modal-card document-editor-card">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Generated Document</p>
          <h3 id="documentTitle">生成文档</h3>
        </div>
        <div class="document-modal-actions">
          <span class="status-pill" id="documentStatus">未加载</span>
          <button class="ghost" value="cancel" type="submit">关闭</button>
        </div>
      </div>

      <div class="document-reader-grid">
        <aside class="document-outline" id="documentOutline">
          <div class="empty-document">
            <strong>正在等待文档结构</strong>
            <span>生成 DOCX 后可在这里查看章节。</span>
          </div>
        </aside>

        <section class="document-preview" id="documentPreview">
          <div class="empty-document">
            <strong>正在等待文档内容</strong>
            <span>点击生成结果中的“查看/编辑文档”后，将以文档版式预览。</span>
          </div>
        </section>
      </div>

      <details class="document-json-pane">
        <summary>结构编辑 JSON</summary>
        <textarea id="documentJsonEditor" class="document-json-editor" spellcheck="false" placeholder="需要精确修改结构时，可在这里编辑文档 JSON。"></textarea>
      </details>

      <details class="document-evaluation-pane">
        <summary>文档质量评估</summary>
        <div class="document-evaluation-controls">
          <div class="document-reference-source">
            <span class="field-label">高质量参考方案</span>
            <strong>远程参考库自动匹配</strong>
          </div>
          <label>
            <span class="field-label">对标 Skill</span>
            <select id="documentEvalSkillSelect"></select>
          </label>
          <button id="evaluateDocumentBtn" type="button">评估当前文档</button>
        </div>
        <div class="document-evaluation-result" id="documentEvaluationResult">
          <div class="status-text">生成或打开 DOCX 后，可在这里评估当前文档质量。</div>
        </div>
      </details>

      <div class="document-actions">
        <button id="formatDocumentJsonBtn" type="button">格式化</button>
        <button id="saveDocumentBtn" type="button">保存并重新渲染</button>
        <a id="documentDownloadLink" class="download disabled" href="#" aria-disabled="true">下载 DOCX</a>
      </div>
      <p class="status-text" id="documentEditStatus">未生成文档。</p>
    </form>
  </dialog>
</section>
