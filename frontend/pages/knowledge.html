<section class="tool-page knowledge-console">
  <div class="tool-main knowledge-doc-panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Maintenance Docs</p>
          <h3>高质量检修方案文档</h3>
          <p class="knowledge-meta-line">
            业务空间 <strong id="bailianWorkspace">-</strong>
            <span>·</span> 默认类目 <strong id="bailianCategory">-</strong>
            <span>·</span> RAG <strong id="bailianRagStatus">-</strong>
          </p>
        </div>
        <div class="panel-actions">
          <span class="pill" id="knowledgeDocCount">0 个</span>
          <button id="refreshKnowledgeBtn" class="ghost" type="button">刷新数据</button>
          <button id="openRetrieveDialogBtn" class="ghost" type="button">检索测试</button>
        </div>
      </div>
      <div class="management-body">
        <div class="filter-bar management-filter-bar">
          <div class="management-filter-fields knowledge-filter-fields">
            <input id="knowledgeFilterName" type="search" placeholder="文档名称">
            <input id="knowledgeFilterStartDate" type="date" aria-label="创建开始日期">
            <input id="knowledgeFilterEndDate" type="date" aria-label="创建结束日期">
            <select id="knowledgeFilterStatus" aria-label="解析状态">
              <option value="">全部解析状态</option>
              <option value="PARSE_SUCCESS">解析成功</option>
              <option value="PARSING">解析中</option>
              <option value="PARSE_FAILED">解析失败</option>
            </select>
          </div>
          <div class="management-filter-actions">
            <button id="knowledgeFilterBtn" type="button">筛选</button>
            <button id="knowledgeFilterResetBtn" class="ghost" type="button">重置</button>
            <button id="openKnowledgeUploadBtn" class="primary" type="button">上传知识文档</button>
          </div>
        </div>
        <div class="status-text management-status" id="knowledgeUploadStatus"></div>
        <div class="management-table-wrap">
          <table class="data-table management-table knowledge-table">
            <thead>
              <tr>
                <th>文档名称</th>
                <th>类型</th>
                <th>大小</th>
                <th>解析状态</th>
                <th>解析器</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="knowledgeList"></tbody>
          </table>
        </div>
      </div>
  </div>
</section>

<dialog class="modal" id="knowledgeUploadDialog">
  <form class="modal-card" id="knowledgeUploadForm">
    <div class="modal-head">
      <h3>上传知识文档</h3>
      <button class="ghost" value="cancel" formmethod="dialog" type="submit">关闭</button>
    </div>
    <p>文件会直接上传到当前默认知识库，上传成功后系统会自动重建索引。</p>
    <label class="upload-dropzone" id="knowledgeDropzone" for="knowledgeFileInput">
      <span class="upload-icon">↑</span>
      <strong>点击或拖拽上传文件</strong>
      <span>支持 md、txt、docx、pdf 格式</span>
      <small id="knowledgeFileName">未选择文件</small>
    </label>
    <input class="file-input-hidden" id="knowledgeFileInput" name="file" type="file" accept=".md,.txt,.docx,.pdf">
    <button class="primary" type="submit">确认上传</button>
  </form>
</dialog>

<dialog class="modal modal-wide" id="knowledgeRetrieveDialog">
  <div class="modal-card knowledge-retrieve-card">
    <div class="modal-head">
      <div>
        <h3>检索测试</h3>
        <p>输入问题，验证当前远程知识库返回的参考片段。</p>
      </div>
      <button class="ghost" id="closeRetrieveDialogBtn" type="button">关闭</button>
    </div>
    <div class="retrieve-query-row">
      <textarea id="retrieveQueryInput" placeholder="例如：创建 ECS 实例前需要检查哪些内容"></textarea>
      <button id="runRetrieveBtn" type="button">开始检索</button>
    </div>
    <div class="retrieve-results" id="retrieveResults">
      <div class="empty-table-state">输入问题后开始检索。</div>
    </div>
  </div>
</dialog>

<dialog class="modal modal-wide" id="knowledgeViewDialog">
  <form class="modal-card knowledge-view-card" method="dialog">
    <div class="modal-head">
      <div>
        <h3 id="knowledgeViewTitle">查看知识文档</h3>
        <p id="knowledgeViewMeta">百炼远程文件详情</p>
      </div>
      <button class="ghost" value="cancel" type="submit">关闭</button>
    </div>
    <div class="detail-grid" id="knowledgeViewDetail"></div>
    <div class="index-detail-panel">
      <div class="item-title">索引解析状态</div>
      <div class="detail-grid" id="knowledgeIndexDetail"></div>
    </div>
  </form>
</dialog>
