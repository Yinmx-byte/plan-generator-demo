<section class="knowledge-console">
  <div class="remote-hero">
    <div>
      <p class="eyebrow">Bailian Knowledge Base</p>
      <h3>远程知识库管理</h3>
      <p>当前页面直接管理百炼业务空间中的文档、索引与检索测试，不再使用本地文件知识库。</p>
    </div>
    <div class="panel-actions">
      <button id="refreshKnowledgeBtn" type="button">刷新</button>
      <button id="openKnowledgeUploadBtn" class="primary" type="button">上传到百炼</button>
    </div>
  </div>

  <div class="metric-grid">
    <div class="metric-card">
      <span>业务空间</span>
      <strong id="bailianWorkspace">-</strong>
    </div>
    <div class="metric-card">
      <span>当前索引</span>
      <strong id="bailianIndex">-</strong>
    </div>
    <div class="metric-card">
      <span>远程文件</span>
      <strong id="bailianFileCount">-</strong>
    </div>
    <div class="metric-card">
      <span>RAG 状态</span>
      <strong id="bailianRagStatus">-</strong>
    </div>
  </div>

  <div class="knowledge-grid">
    <div class="tool-main">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Remote Files</p>
          <h3>百炼文档</h3>
        </div>
        <span class="status-pill" id="bailianCategory">-</span>
      </div>
      <div class="remote-file-list" id="knowledgeList"></div>
    </div>

    <div class="tool-card">
      <h3>索引操作</h3>
      <label class="field-label">类目名称</label>
      <input id="indexCategoryInput" type="text" placeholder="plan-generator-ecs">
      <label class="field-label">新索引名称</label>
      <input id="indexNameInput" type="text" placeholder="pg-ecs-v5">
      <button id="createIndexBtn" class="primary" type="button">创建远程索引</button>
      <button id="checkIndexJobBtn" type="button">查看索引任务</button>
      <div class="status-text" id="indexJobStatus"></div>
    </div>
  </div>

  <div class="retrieve-panel">
    <div class="panel-head">
      <div>
        <p class="eyebrow">Retrieve Test</p>
        <h3>检索测试</h3>
      </div>
      <button id="runRetrieveBtn" type="button">检索</button>
    </div>
    <textarea id="retrieveQueryInput" placeholder="例如：创建 ECS 实例前需要检查哪些内容"></textarea>
    <div class="retrieve-results" id="retrieveResults"></div>
  </div>

  <div class="status-text" id="knowledgeUploadStatus"></div>
</section>

<dialog class="modal" id="knowledgeUploadDialog">
  <form class="modal-card" id="knowledgeUploadForm">
    <div class="modal-head">
      <h3>上传到百炼知识库</h3>
      <button class="ghost" value="cancel" formmethod="dialog" type="submit">关闭</button>
    </div>
    <p>文件会直接上传到百炼业务空间。上传后如需用于方案生成，请创建新的远程索引。</p>
    <input id="knowledgeCategoryInput" name="category_name" type="text" placeholder="类目名称，例如 plan-generator-ecs">
    <input id="knowledgeFileInput" name="file" type="file" accept=".md,.txt,.docx,.pdf">
    <button class="primary" type="submit">确认上传</button>
  </form>
</dialog>
