<section class="knowledge-console">
  <div class="knowledge-statusbar">
    <div class="status-line-item">
      <span>业务空间</span>
      <strong id="bailianWorkspace">-</strong>
    </div>
    <div class="status-line-item">
      <span>默认类目</span>
      <strong id="bailianCategory">-</strong>
    </div>
    <div class="status-line-item">
      <span>文档数量</span>
      <strong id="bailianFileCount">-</strong>
    </div>
    <div class="status-line-item">
      <span>RAG 状态</span>
      <strong id="bailianRagStatus">-</strong>
    </div>
    <button id="refreshKnowledgeBtn" type="button">刷新</button>
  </div>

  <div class="knowledge-workspace">
    <div class="tool-main knowledge-doc-panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Maintenance Docs</p>
          <h3>高质量检修方案文档</h3>
        </div>
        <div class="panel-actions">
          <span class="pill" id="knowledgeDocCount">0 个</span>
          <button id="openKnowledgeUploadBtn" class="primary" type="button">上传知识文档</button>
        </div>
      </div>
      <div class="remote-file-list" id="knowledgeList"></div>
    </div>

    <div class="retrieve-panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Retrieve Test</p>
          <h3>检索测试</h3>
        </div>
        <button id="runRetrieveBtn" type="button">检索</button>
      </div>
      <textarea id="retrieveQueryInput" placeholder="例如：创建 ECS 实例前需要检查哪些内容"></textarea>
      <div class="retrieve-results" id="retrieveResults"></div>
    </div>
  </div>

  <div class="status-text" id="knowledgeUploadStatus"></div>
</section>

<dialog class="modal" id="knowledgeUploadDialog">
  <form class="modal-card" id="knowledgeUploadForm">
    <div class="modal-head">
      <h3>上传知识文档</h3>
      <button class="ghost" value="cancel" formmethod="dialog" type="submit">关闭</button>
    </div>
    <p>文件会直接上传到当前默认知识库，上传成功后系统会自动重建索引。</p>
    <label class="upload-dropzone" id="knowledgeDropzone" for="knowledgeFileInput">
      <span class="upload-icon">↑</span>
      <strong>点击或拖拽上传文件</strong>
      <span>支持 md、txt、docx、pdf 格式</span>
      <small id="knowledgeFileName">未选择文件</small>
    </label>
    <input class="file-input-hidden" id="knowledgeFileInput" name="file" type="file" accept=".md,.txt,.docx,.pdf">
    <button class="primary" type="submit">确认上传</button>
  </form>
</dialog>

<dialog class="modal modal-wide" id="knowledgeViewDialog">
  <form class="modal-card knowledge-view-card" method="dialog">
    <div class="modal-head">
      <div>
        <h3 id="knowledgeViewTitle">查看知识文档</h3>
        <p id="knowledgeViewMeta">百炼远程文件详情</p>
      </div>
      <button class="ghost" value="cancel" type="submit">关闭</button>
    </div>
    <div class="detail-grid" id="knowledgeViewDetail"></div>
    <div class="retrieve-card">
      <div class="item-title">文档内容预览</div>
      <pre id="knowledgeContentPreview">-</pre>
    </div>
    <div class="retrieve-card">
      <div class="item-title">索引解析状态</div>
      <pre id="knowledgeIndexDetail">-</pre>
    </div>
  </form>
</dialog>
