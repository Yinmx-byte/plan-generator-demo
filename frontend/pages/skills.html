<section class="tool-page">
  <div class="tool-main">
    <div class="panel-head">
      <div>
        <p class="eyebrow">AgentScope Skill</p>
        <h3>Skill 管理</h3>
      </div>
      <div class="panel-actions">
        <span class="pill" id="skillCount">0 个</span>
        <button id="openSkillUploadBtn" type="button">上传 Skill</button>
      </div>
    </div>
    <div class="item-grid" id="skillList"></div>
  </div>

  <div class="tool-card">
    <h3>设计原则</h3>
    <p>Skill 只放稳定规则、资源字段、步骤模板和风险约束；历史方案原文和同类措辞交给 RAG。</p>
    <div class="status-text" id="uploadStatus"></div>
  </div>
</section>

<dialog class="modal" id="skillUploadDialog">
  <form class="modal-card" id="uploadForm">
    <div class="modal-head">
      <h3>上传 Skill</h3>
      <button class="ghost" value="cancel" formmethod="dialog" type="submit">关闭</button>
    </div>
    <p>支持单个 SKILL.md，或包含 SKILL.md 的 zip 包。</p>
    <input id="skillNameInput" name="skill_name" type="text" placeholder="Skill 目录名，可选">
    <label class="upload-dropzone" id="skillDropzone" for="skillFileInput">
      <span class="upload-icon">↑</span>
      <strong>点击或拖拽上传文件</strong>
      <span>支持 SKILL.md 或 zip 包</span>
      <small id="skillFileName">未选择文件</small>
    </label>
    <input class="file-input-hidden" id="skillFileInput" name="file" type="file" accept=".md,.zip">
    <button class="primary" type="submit">确认上传</button>
  </form>
</dialog>

<dialog class="modal modal-wide" id="skillEditDialog">
  <form class="modal-card skill-editor-card" id="skillEditForm">
    <div class="modal-head">
      <div>
        <h3 id="skillEditTitle">编辑 Skill</h3>
        <p id="skillEditMeta">仅编辑 SKILL.md，scripts 暂不开放。</p>
      </div>
      <button class="ghost" value="cancel" formmethod="dialog" type="submit">关闭</button>
    </div>
    <div class="skill-version-row">
      <label for="skillVersionSelect">历史版本</label>
      <select id="skillVersionSelect">
        <option value="">暂无历史版本</option>
      </select>
      <button id="rollbackSkillBtn" type="button" disabled>回退到此版本</button>
    </div>
    <textarea id="skillEditor" spellcheck="false" placeholder="SKILL.md 内容"></textarea>
    <div class="modal-actions">
      <span class="status-text" id="skillEditStatus"></span>
      <button class="primary" id="saveSkillBtn" type="submit">保存 Skill</button>
    </div>
  </form>
</dialog>
