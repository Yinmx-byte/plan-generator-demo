<section class="tool-page">
  <div class="tool-main">
    <div class="panel-head">
      <div>
        <p class="eyebrow">AgentScope Skill</p>
        <h3>Skill 管理</h3>
      </div>
      <span class="pill" id="skillCount">0 个</span>
    </div>
    <div class="item-grid" id="skillList"></div>
  </div>

  <form class="tool-card" id="uploadForm">
    <h3>上传 Skill</h3>
    <p>支持单个 SKILL.md，或包含 SKILL.md 的 zip 包。</p>
    <input id="skillNameInput" name="skill_name" type="text" placeholder="Skill 目录名，可选">
    <input id="skillFileInput" name="file" type="file" accept=".md,.zip">
    <button class="primary" type="submit">上传 Skill</button>
    <div class="status-text" id="uploadStatus"></div>
  </form>
</section>
